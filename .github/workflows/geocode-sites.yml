name: Geocode sites (one-off)
on:
  push:
    branches: [claude/project-thread-kyep9v]
    paths: ['.github/scripts/geocode-sites.mjs']
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/geocode-sites.mjs
