# Builds the Android test app and puts it on the site's download page (/download).
# Runs when the phone app changes on main or in a pull request, or by hand from the Actions tab.
# The new APK is committed back to the same branch, so merging to main publishes it.
name: Android test build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Member app address the phone app opens
        default: https://vgo-rewards.onrender.com/app/
  push:
    branches: [main]
    paths: ['packages/mobile/**', '.github/workflows/android-test-build.yml']
  pull_request:
    paths: ['packages/mobile/**', '.github/workflows/android-test-build.yml']

permissions:
  contents: write

concurrency:
  group: android-test-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      SERVER_URL: ${{ inputs.server_url || 'https://vgo-rewards.onrender.com/app/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Point the app at the server
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.SERVER_URL;
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            config.server.url = url;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2) + "\n");
            const page = fs.readFileSync("www/offline.html", "utf8").replace(/VGO_APP_URL = .*?;/, `VGO_APP_URL = ${JSON.stringify(url)};`);
            fs.writeFileSync("www/offline.html", page);
          '
      - name: Build the APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PvgoVersionCode=${{ github.run_number }} \
            -PvgoVersionName=0.1.${{ github.run_number }}
      - name: Put it on the download page
        run: |
          out=../app/public/download
          mkdir -p $out
          cp android/app/build/outputs/apk/release/app-release.apk $out/vgo-rewards.apk
          node -e '
            const fs = require("fs");
            const info = {
              version: "0.1.${{ github.run_number }}",
              builtAt: new Date().toISOString(),
              sizeMB: +(fs.statSync(process.argv[1]).size / 1048576).toFixed(1),
              serverUrl: process.env.SERVER_URL,
              commit: process.env.GITHUB_SHA.slice(0, 7),
            };
            fs.writeFileSync(process.argv[2], JSON.stringify(info, null, 2) + "\n");
          ' $out/vgo-rewards.apk $out/android.json
      - uses: actions/upload-artifact@v4
        with:
          name: vgo-rewards-android-0.1.${{ github.run_number }}
          path: packages/app/public/download/vgo-rewards.apk
      - name: Commit the new build
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/app/public/download/vgo-rewards.apk packages/app/public/download/android.json
          git commit -m "Android test build 0.1.${{ github.run_number }}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
