# Render blueprint for the free plan. Free servers have no lasting disk, so data is kept in a
# free Upstash Redis database. Secrets (sync: false) are typed into Render, never committed here.
services:
  - type: web
    name: vgo-rewards
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/console/src/main.js
    healthCheckPath: /app/
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: VGO_ADMIN_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: VGO_DEV_CODES
        sync: false
      # What the POS link signs its calls with. Set it when the link vendor is connected.
      - key: VGO_POS_KEY
        sync: false
