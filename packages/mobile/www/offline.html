<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VGO Rewards</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f2747; color: #fff; font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; gap: 14px; }
    h1 { font-size: 24px; margin: 0; }
    p { margin: 0; color: #c9d3e0; max-width: 300px; line-height: 1.4; }
    button { margin-top: 10px; background: #c8102e; color: #fff; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 17px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach VGO Rewards</h1>
    <p>Check that your phone is online. If it is, the rewards server may be waking up, which can take up to a minute.</p>
    <button onclick="location.href = window.VGO_APP_URL">Try again</button>
  </main>
  <script>window.VGO_APP_URL = 'https://vgo-rewards.onrender.com/app/';</script>
</body>
</html>
