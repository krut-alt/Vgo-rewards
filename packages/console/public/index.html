<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VGO Rewards console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Console">
      <div class="brand">
        <div class="brand-logo"><img id="logo" src="/vgo-logo.png" alt="VGO"></div>
        <span class="brand-name" id="brand-name">Rewards</span>
      </div>
      <span class="sub">Jobber console</span>
      <a href="#/offers" data-nav="offers">Offers</a>
      <a href="#/rules" data-nav="rules">Reward rules</a>
      <a href="#/stores" data-nav="stores">Locations</a>
      <a href="#/members" data-nav="members">Members</a>
      <a href="#/results" data-nav="results">Results</a>
      <div class="grow"></div>
      <span class="who">Signed in as Jobber admin</span>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="dialog"><div class="pad" id="dialog-body"></div></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
